name: Project01 – Workflow Sanity Check

on:
  push:
    branches:
      - main
    paths:
      - "Project01-static-site/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runner & files
        run: |
          echo "✅ GitHub Actions is running correctly"
          echo "📂 Listing repository files:"
          ls -la
          echo "📂 Listing Project01-static-site:"
          ls -la Project01-static-site || echo "Folder not found"

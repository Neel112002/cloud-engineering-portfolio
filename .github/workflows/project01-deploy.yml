name: Deploy Project01 to S3 + CloudFront

on:
  push:
    branches:
      - main
    paths:
      - "Project01-static-site/**"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::584108278233:role/github-actions-static-site-deploy
          aws-region: us-east-1

      - name: Sync Project01 files to S3
        run: |
          aws s3 sync Project01-static-site/ s3://neel-cloud-engineering-portfolio-project01 --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E19LHMXP03G7EQ \
            --paths "/*"
